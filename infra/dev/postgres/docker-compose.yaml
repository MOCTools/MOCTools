services:
  postgres:
    image: postgres:18
    container_name: moctools-postgres-dev

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  epg-fetcher:
    build:
      context: ../../..
      dockerfile: services/epg-fetcher/Dockerfile

    container_name: moctools-epg-fetcher-dev

    env_file:
      - ../../../services/epg-fetcher/.env

    environment:
      MOCTOOLS_DB_CONNECTION_STRING: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres-data: